<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130">
  <rect width="900" height="130" fill="#0A1628" rx="8"/>
  <text x="14" y="18" font-family="Calibri,sans-serif" font-size="13" fill="#90CAF9" font-weight="bold">SURFACE CODE  &#x2014;  Leading Quantum Error Correction Architecture</text>
  <!-- Grid of physical qubits -->
  <text x="14" y="34" font-family="Calibri,sans-serif" font-size="11" fill="#B0BEC5">Physical qubit lattice (5x5 shown):</text>
  <!-- Data qubits (blue) -->
  <circle cx="50" cy="56" r="9" fill="#1E88E5" stroke="#90CAF9" stroke-width="1.5"/>
  <circle cx="90" cy="56" r="9" fill="#1E88E5" stroke="#90CAF9" stroke-width="1.5"/>
  <circle cx="130" cy="56" r="9" fill="#1E88E5" stroke="#90CAF9" stroke-width="1.5"/>
  <circle cx="50" cy="96" r="9" fill="#1E88E5" stroke="#90CAF9" stroke-width="1.5"/>
  <circle cx="90" cy="96" r="9" fill="#EF5350" stroke="#FF8A80" stroke-width="2.5"/>
  <circle cx="130" cy="96" r="9" fill="#1E88E5" stroke="#90CAF9" stroke-width="1.5"/>
  <circle cx="50" cy="116" r="9" fill="#1E88E5" stroke="#90CAF9" stroke-width="1.5"/>
  <circle cx="90" cy="116" r="9" fill="#1E88E5" stroke="#90CAF9" stroke-width="1.5"/>
  <circle cx="130" cy="116" r="9" fill="#1E88E5" stroke="#90CAF9" stroke-width="1.5"/>
  <!-- Syndrome (ancilla) qubits (green) -->
  <rect x="61" y="67" width="18" height="18" rx="2" fill="#2E7D32" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="70" y="80" text-anchor="middle" font-family="Calibri,sans-serif" font-size="8" fill="#FFFFFF">S</text>
  <rect x="101" y="67" width="18" height="18" rx="2" fill="#2E7D32" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="110" y="80" text-anchor="middle" font-family="Calibri,sans-serif" font-size="8" fill="#FFFFFF">S</text>
  <rect x="61" y="107" width="18" height="18" rx="2" fill="#2E7D32" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="70" y="120" text-anchor="middle" font-family="Calibri,sans-serif" font-size="8" fill="#FFFFFF">S</text>
  <rect x="101" y="107" width="18" height="18" rx="2" fill="#2E7D32" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="110" y="120" text-anchor="middle" font-family="Calibri,sans-serif" font-size="8" fill="#FFFFFF">S</text>
  <!-- Error marker -->
  <text x="90" y="93" text-anchor="middle" font-family="Calibri,sans-serif" font-size="7" fill="#FF8A80">ERROR</text>
  <!-- Legend -->
  <circle cx="160" cy="60" r="7" fill="#1E88E5" stroke="#90CAF9" stroke-width="1.5"/>
  <text x="172" y="64" font-family="Calibri,sans-serif" font-size="10" fill="#90CAF9">Data qubit</text>
  <rect x="153" y="73" width="14" height="14" rx="2" fill="#2E7D32" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="172" y="84" font-family="Calibri,sans-serif" font-size="10" fill="#A5D6A7">Syndrome (ancilla)</text>
  <circle cx="160" cy="100" r="7" fill="#EF5350" stroke="#FF8A80" stroke-width="2"/>
  <text x="172" y="104" font-family="Calibri,sans-serif" font-size="10" fill="#EF9A9A">Error detected</text>
  <!-- Stats column -->
  <line x1="270" y1="26" x2="270" y2="126" stroke="#37474F" stroke-width="1"/>
  <text x="290" y="40" font-family="Calibri,sans-serif" font-size="12" fill="#FFD54F" font-weight="bold">QEC Code Comparison</text>
  <text x="290" y="56" font-family="Calibri,sans-serif" font-size="11" fill="#E3F2FD">Shor Code:     9 physical &#x2192; 1 logical qubit</text>
  <text x="290" y="72" font-family="Calibri,sans-serif" font-size="11" fill="#E3F2FD">Steane Code:   7 physical &#x2192; 1 logical qubit</text>
  <text x="290" y="88" font-family="Calibri,sans-serif" font-size="11" fill="#FFD54F" font-weight="bold">Surface Code: ~1,000 physical &#x2192; 1 logical</text>
  <text x="290" y="104" font-family="Calibri,sans-serif" font-size="10" fill="#B0BEC5">Google 2023: first below-threshold demonstration</text>
  <text x="290" y="118" font-family="Calibri,sans-serif" font-size="10" fill="#B0BEC5">Threshold: error rate &lt; ~1% (threshold theorem)</text>
</svg>
