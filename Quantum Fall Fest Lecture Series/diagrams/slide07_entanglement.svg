<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <rect width="900" height="120" fill="#0A1628" rx="8"/>
  <text x="14" y="20" font-family="Calibri,sans-serif" font-size="13" fill="#90CAF9" font-weight="bold">BELL STATE CIRCUIT  —  Creating Entanglement</text>
  <!-- Circuit wires -->
  <text x="14" y="52" font-family="Calibri,sans-serif" font-size="13" fill="#B3E5FC">q&#x2080; &#x2500;&#x2500;</text>
  <line x1="56" y1="48" x2="108" y2="48" stroke="#B3E5FC" stroke-width="2"/>
  <rect x="108" y="36" width="38" height="24" rx="4" fill="#1565C0" stroke="#42A5F5" stroke-width="2"/>
  <text x="127" y="53" text-anchor="middle" font-family="Calibri,sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">H</text>
  <line x1="146" y1="48" x2="196" y2="48" stroke="#B3E5FC" stroke-width="2"/>
  <circle cx="196" cy="48" r="6" fill="#42A5F5" stroke="#90CAF9" stroke-width="1.5"/>
  <line x1="196" y1="54" x2="196" y2="80" stroke="#42A5F5" stroke-width="2"/>
  <line x1="202" y1="48" x2="256" y2="48" stroke="#B3E5FC" stroke-width="2"/>
  <rect x="256" y="36" width="36" height="24" rx="4" fill="#37474F" stroke="#78909C" stroke-width="2"/>
  <text x="274" y="52" text-anchor="middle" font-family="Calibri,sans-serif" font-size="12" fill="#FFFFFF">&#x2221;</text>
  <text x="274" y="65" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#B0BEC5">meas</text>
  <!-- qubit 1 -->
  <text x="14" y="88" font-family="Calibri,sans-serif" font-size="13" fill="#C8E6C9">q&#x2081; &#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;</text>
  <circle cx="196" cy="80" r="13" fill="none" stroke="#66BB6A" stroke-width="2.5"/>
  <line x1="196" y1="67" x2="196" y2="93" stroke="#66BB6A" stroke-width="2.5"/>
  <line x1="183" y1="80" x2="209" y2="80" stroke="#66BB6A" stroke-width="2.5"/>
  <line x1="202" y1="80" x2="256" y2="80" stroke="#C8E6C9" stroke-width="2"/>
  <rect x="256" y="68" width="36" height="24" rx="4" fill="#37474F" stroke="#78909C" stroke-width="2"/>
  <text x="274" y="84" text-anchor="middle" font-family="Calibri,sans-serif" font-size="12" fill="#FFFFFF">&#x2221;</text>
  <text x="274" y="97" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#B0BEC5">meas</text>
  <!-- Labels -->
  <text x="127" y="30" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#A5D6A7">superpose</text>
  <text x="196" y="28" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#A5D6A7">entangle</text>
  <!-- Result box -->
  <rect x="310" y="28" width="270" height="70" rx="8" fill="#1E3A5F" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="445" y="48" text-anchor="middle" font-family="Calibri,sans-serif" font-size="14" fill="#FFD54F" font-weight="bold">Result: Bell State |&#x3A6;&#x207A;&#x27E9;</text>
  <text x="445" y="66" text-anchor="middle" font-family="Calibri,sans-serif" font-size="13" fill="#E3F2FD">= (|00&#x27E9; + |11&#x27E9;) / &#x221A;2</text>
  <text x="445" y="84" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#A5D6A7">Measure &#x2192; always 00 or 11, never 01 or 10</text>
  <!-- Alice Bob diagram -->
  <circle cx="660" cy="55" r="22" fill="none" stroke="#1E88E5" stroke-width="2"/>
  <text x="660" y="50" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#90CAF9" font-weight="bold">Alice</text>
  <text x="660" y="65" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#90CAF9">q&#x2080;</text>
  <line x1="682" y1="55" x2="745" y2="55" stroke="#EF5350" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="713" y="46" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#FF8A80">entangled pair</text>
  <circle cx="767" cy="55" r="22" fill="none" stroke="#66BB6A" stroke-width="2"/>
  <text x="767" y="50" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#A5D6A7" font-weight="bold">Bob</text>
  <text x="767" y="65" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#A5D6A7">q&#x2081;</text>
  <text x="713" y="90" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#B0BEC5">any distance apart &#x2022; Nobel Prize 2022</text>
</svg>
