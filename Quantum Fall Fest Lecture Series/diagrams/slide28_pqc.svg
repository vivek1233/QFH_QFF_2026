<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <rect width="900" height="120" fill="#0A1628" rx="8"/>
  <text x="14" y="18" font-family="Calibri,sans-serif" font-size="13" fill="#90CAF9" font-weight="bold">POST-QUANTUM CRYPTOGRAPHY  &#x2014;  NIST 2024 Standards</text>
  <!-- Vulnerable algorithms -->
  <rect x="14" y="26" width="280" height="80" rx="6" fill="#7F0000" stroke="#EF5350" stroke-width="1.5"/>
  <text x="154" y="44" text-anchor="middle" font-family="Calibri,sans-serif" font-size="12" fill="#FFCDD2" font-weight="bold">&#x26A0; VULNERABLE (Shor's Algo)</text>
  <text x="24" y="60" font-family="Calibri,sans-serif" font-size="11" fill="#FFCDD2">RSA-2048 / RSA-4096</text>
  <text x="24" y="75" font-family="Calibri,sans-serif" font-size="11" fill="#FFCDD2">ECC (Elliptic Curve)</text>
  <text x="24" y="90" font-family="Calibri,sans-serif" font-size="11" fill="#FFCDD2">Diffie-Hellman Key Exchange</text>
  <text x="24" y="104" font-family="Calibri,sans-serif" font-size="9" fill="#EF9A9A">Basis: integer factoring / discrete log</text>
  <!-- Arrow -->
  <text x="302" y="72" font-family="Calibri,sans-serif" font-size="22" fill="#FFD54F">&#x2192;</text>
  <!-- PQC Standards -->
  <rect x="330" y="26" width="556" height="80" rx="6" fill="#1B5E20" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="608" y="44" text-anchor="middle" font-family="Calibri,sans-serif" font-size="12" fill="#A5D6A7" font-weight="bold">&#x2714; NIST PQC Standards (Aug 2024)</text>
  <!-- Table header -->
  <text x="340" y="58" font-family="Calibri,sans-serif" font-size="10" fill="#FFD54F" font-weight="bold">Standard</text>
  <text x="440" y="58" font-family="Calibri,sans-serif" font-size="10" fill="#FFD54F" font-weight="bold">Algorithm</text>
  <text x="610" y="58" font-family="Calibri,sans-serif" font-size="10" fill="#FFD54F" font-weight="bold">Basis</text>
  <text x="760" y="58" font-family="Calibri,sans-serif" font-size="10" fill="#FFD54F" font-weight="bold">Use</text>
  <line x1="336" y1="61" x2="880" y2="61" stroke="#2E7D32" stroke-width="0.8"/>
  <text x="340" y="74" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">FIPS 203</text>
  <text x="440" y="74" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">CRYSTALS-Kyber</text>
  <text x="610" y="74" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">LWE lattice</text>
  <text x="760" y="74" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">Key encapsulation</text>
  <text x="340" y="88" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">FIPS 204</text>
  <text x="440" y="88" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">CRYSTALS-Dilithium</text>
  <text x="610" y="88" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">MLWE lattice</text>
  <text x="760" y="88" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">Digital signatures</text>
  <text x="340" y="102" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">FIPS 205</text>
  <text x="440" y="102" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">SPHINCS+</text>
  <text x="610" y="102" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">Hash-based</text>
  <text x="760" y="102" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">Digital signatures</text>
</svg>
