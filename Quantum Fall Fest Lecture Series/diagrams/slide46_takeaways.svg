<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="900" height="100">
  <rect width="900" height="100" fill="#0A1628" rx="8"/>
  <text x="14" y="18" font-family="Calibri,sans-serif" font-size="13" fill="#90CAF9" font-weight="bold">TOP 10 KEY TAKEAWAYS  &#x2014;  What Every Attendee Should Remember</text>
  <!-- Two columns of takeaway badges -->
  <rect x="14" y="26" width="24" height="20" rx="3" fill="#1E88E5"/><text x="26" y="40" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold">1</text>
  <text x="44" y="40" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">Qubits exploit superposition + entanglement for exponential state space</text>
  <rect x="14" y="50" width="24" height="20" rx="3" fill="#1E88E5"/><text x="26" y="64" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold">2</text>
  <text x="44" y="64" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">Quantum gates are unitary (reversible) — unlike classical gates</text>
  <rect x="14" y="74" width="24" height="20" rx="3" fill="#1E88E5"/><text x="26" y="88" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold">3</text>
  <text x="44" y="88" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">Speedup = superposition + interference + entanglement working together</text>
  <!-- Col 2 -->
  <rect x="310" y="26" width="24" height="20" rx="3" fill="#42A5F5"/><text x="322" y="40" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold">4</text>
  <text x="340" y="40" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">Decoherence is the #1 practical challenge — QEC solves it at cost</text>
  <rect x="310" y="50" width="24" height="20" rx="3" fill="#42A5F5"/><text x="322" y="64" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold">5</text>
  <text x="340" y="64" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">Shor's threatens RSA/ECC — NIST PQC (FIPS 203/204/205) is the fix</text>
  <rect x="310" y="74" width="24" height="20" rx="3" fill="#42A5F5"/><text x="322" y="88" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold">6</text>
  <text x="340" y="88" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">Quantum advantage for real problems = NOT yet demonstrated (NISQ era)</text>
  <!-- Col 3 -->
  <rect x="610" y="26" width="24" height="20" rx="3" fill="#66BB6A"/><text x="622" y="40" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold">7</text>
  <text x="640" y="40" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">Near-term: chemistry, optimization, sensing. Long-term: Shor's at scale</text>
  <rect x="610" y="50" width="24" height="20" rx="3" fill="#66BB6A"/><text x="622" y="64" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold">8</text>
  <text x="640" y="64" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">Multiple HW platforms: IBM SC, IonQ trapped ion, QuEra neutral atom</text>
  <rect x="610" y="74" width="24" height="20" rx="3" fill="#66BB6A"/><text x="622" y="88" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold">9</text>
  <text x="640" y="88" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">Free cloud access TODAY: quantum.ibm.com — start now!</text>
</svg>
