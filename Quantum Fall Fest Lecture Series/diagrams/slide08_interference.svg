<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <rect width="900" height="120" fill="#0A1628" rx="8"/>
  <text x="14" y="18" font-family="Calibri,sans-serif" font-size="13" fill="#90CAF9" font-weight="bold">QUANTUM INTERFERENCE  &#x2014;  Amplifying the Correct Answer</text>
  <!-- Destructive -->
  <text x="14" y="38" font-family="Calibri,sans-serif" font-size="11" fill="#EF9A9A">Destructive (wrong paths cancel):</text>
  <path d="M14,65 Q42,42 70,65 Q98,88 126,65" fill="none" stroke="#EF5350" stroke-width="2"/>
  <path d="M14,65 Q42,88 70,65 Q98,42 126,65" fill="none" stroke="#EF5350" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>
  <text x="135" y="69" font-family="Calibri,sans-serif" font-size="20" fill="#EF5350" font-weight="bold">= 0</text>
  <text x="190" y="69" font-family="Calibri,sans-serif" font-size="10" fill="#EF9A9A">amplitudes cancel out</text>
  <!-- Constructive -->
  <text x="310" y="38" font-family="Calibri,sans-serif" font-size="11" fill="#A5D6A7">Constructive (correct path amplified):</text>
  <path d="M310,65 Q338,42 366,65 Q394,42 422,65" fill="none" stroke="#66BB6A" stroke-width="2.5"/>
  <path d="M310,65 Q338,42 366,65 Q394,42 422,65" fill="none" stroke="#A5D6A7" stroke-width="1.5" transform="translate(0,8)" opacity="0.7"/>
  <text x="430" y="69" font-family="Calibri,sans-serif" font-size="20" fill="#66BB6A" font-weight="bold">= MAX</text>
  <text x="510" y="69" font-family="Calibri,sans-serif" font-size="10" fill="#A5D6A7">amplitudes reinforce</text>
  <!-- Probability bar chart -->
  <line x1="620" y1="18" x2="620" y2="116" stroke="#37474F" stroke-width="1"/>
  <text x="640" y="30" font-family="Calibri,sans-serif" font-size="11" fill="#FFD54F" font-weight="bold">Before:</text>
  <rect x="640" y="38" width="14" height="36" fill="#546E7A" rx="2"/>
  <rect x="660" y="44" width="14" height="30" fill="#546E7A" rx="2"/>
  <rect x="680" y="34" width="14" height="40" fill="#546E7A" rx="2"/>
  <rect x="700" y="42" width="14" height="32" fill="#546E7A" rx="2"/>
  <rect x="720" y="36" width="14" height="38" fill="#546E7A" rx="2"/>
  <text x="740" y="30" font-family="Calibri,sans-serif" font-size="11" fill="#FFD54F" font-weight="bold">After:</text>
  <rect x="740" y="70" width="14" height="4" fill="#EF5350" rx="1"/>
  <rect x="760" y="68" width="14" height="6" fill="#EF5350" rx="1"/>
  <rect x="780" y="28" width="14" height="46" fill="#66BB6A" rx="2"/>
  <rect x="800" y="69" width="14" height="5" fill="#EF5350" rx="1"/>
  <rect x="820" y="71" width="14" height="3" fill="#EF5350" rx="1"/>
  <text x="787" y="85" text-anchor="middle" font-family="Calibri,sans-serif" font-size="8" fill="#A5D6A7">correct answer</text>
  <!-- Bottom label -->
  <text x="450" y="108" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#B0BEC5">This mechanism powers Grover search, Shor's QFT, and all quantum speedups</text>
</svg>
