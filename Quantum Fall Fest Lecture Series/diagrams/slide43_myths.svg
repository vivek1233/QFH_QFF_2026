<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <rect width="900" height="120" fill="#0A1628" rx="8"/>
  <text x="14" y="18" font-family="Calibri,sans-serif" font-size="13" fill="#90CAF9" font-weight="bold">10 QUANTUM MYTHS vs. FACTS  &#x2014;  Quick Reference</text>
  <!-- Myths column -->
  <rect x="14" y="26" width="420" height="86" rx="5" fill="#7F0000" stroke="#EF5350" stroke-width="1.2"/>
  <text x="224" y="42" text-anchor="middle" font-family="Calibri,sans-serif" font-size="12" fill="#FFCDD2" font-weight="bold">MYTHS &#x274C;</text>
  <text x="24" y="56" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">1. QC will replace classical computers</text>
  <text x="24" y="67" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">2. Quantum = trying all answers simultaneously</text>
  <text x="24" y="78" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">3. Quantum breaks ALL encryption</text>
  <text x="24" y="89" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">4. More qubits = more powerful</text>
  <text x="24" y="100" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">5. Entanglement = FTL communication</text>
  <text x="224" y="56" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">6. Room temperature operation</text>
  <text x="224" y="67" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">7. Infinitely faster than classical</text>
  <text x="224" y="78" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">8. Need PhD to program</text>
  <text x="224" y="89" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">9. Quantum computers exist at useful scale</text>
  <text x="224" y="100" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">10. D-Wave = gate-based quantum computer</text>
  <!-- Facts column -->
  <rect x="450" y="26" width="436" height="86" rx="5" fill="#1B5E20" stroke="#66BB6A" stroke-width="1.2"/>
  <text x="668" y="42" text-anchor="middle" font-family="Calibri,sans-serif" font-size="12" fill="#A5D6A7" font-weight="bold">FACTS &#x2714;</text>
  <text x="460" y="56" font-family="Calibri,sans-serif" font-size="9" fill="#C8E6C9">Specialized tools — classical stays optimal for most</text>
  <text x="460" y="67" font-family="Calibri,sans-serif" font-size="9" fill="#C8E6C9">Superposition + interference together = speedup</text>
  <text x="460" y="78" font-family="Calibri,sans-serif" font-size="9" fill="#C8E6C9">Only RSA/ECC threatened — AES-256 safe (with doubling)</text>
  <text x="460" y="89" font-family="Calibri,sans-serif" font-size="9" fill="#C8E6C9">Fidelity and coherence time matter as much as count</text>
  <text x="460" y="100" font-family="Calibri,sans-serif" font-size="9" fill="#C8E6C9">No-communication theorem: entanglement can't send info FTL</text>
  <text x="460" y="111" font-family="Calibri,sans-serif" font-size="8" fill="#90CAF9">15 mK cooling required  |  High school math + Python = enough  |  D-Wave = quantum annealing</text>
</svg>
