<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <rect width="900" height="120" fill="#0A1628" rx="8"/>
  <text x="14" y="18" font-family="Calibri,sans-serif" font-size="13" fill="#90CAF9" font-weight="bold">QUANTUM TECHNOLOGY ROADMAP  &#x2014;  Four Phase Journey</text>
  <defs><marker id="at" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#42A5F5"/></marker></defs>
  <!-- Timeline bar -->
  <line x1="14" y1="68" x2="882" y2="68" stroke="#37474F" stroke-width="3"/>
  <line x1="872" y1="65" x2="886" y2="68" stroke="#37474F" stroke-width="3"/>
  <line x1="872" y1="71" x2="886" y2="68" stroke="#37474F" stroke-width="3"/>
  <!-- Phase markers -->
  <circle cx="100" cy="68" r="8" fill="#EF5350"/>
  <circle cx="320" cy="68" r="8" fill="#FFB300"/>
  <circle cx="570" cy="68" r="8" fill="#42A5F5"/>
  <circle cx="800" cy="68" r="8" fill="#66BB6A"/>
  <!-- Phase 1 NISQ -->
  <rect x="24" y="28" width="166" height="32" rx="5" fill="#B71C1C" stroke="#EF5350" stroke-width="1.5"/>
  <text x="107" y="42" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold">Phase 1: NISQ Era</text>
  <text x="107" y="54" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">Now &#x2014; ~2027</text>
  <line x1="107" y1="60" x2="100" y2="60" stroke="#EF5350" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="60" y="88" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">100-1000Q</text>
  <text x="60" y="100" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">VQE, QAOA</text>
  <text x="60" y="112" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">error mitigation</text>
  <!-- Phase 2 Early FT -->
  <rect x="220" y="28" width="200" height="32" rx="5" fill="#E65100" stroke="#FFB300" stroke-width="1.5"/>
  <text x="320" y="42" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold">Phase 2: Early FT</text>
  <text x="320" y="54" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#FFE082">~2027 &#x2014; 2032</text>
  <line x1="320" y1="60" x2="320" y2="60" stroke="#FFB300" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="280" y="88" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#FFE082">Logical qubits</text>
  <text x="280" y="100" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#FFE082">1K-10K logical Q</text>
  <text x="280" y="112" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#FFE082">Better chemistry</text>
  <!-- Phase 3 Fault tolerant -->
  <rect x="450" y="28" width="220" height="32" rx="5" fill="#1565C0" stroke="#42A5F5" stroke-width="1.5"/>
  <text x="560" y="42" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold">Phase 3: Fault-Tolerant</text>
  <text x="560" y="54" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#B3E5FC">~2032 &#x2014; 2040</text>
  <text x="530" y="88" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#B3E5FC">Millions of Q</text>
  <text x="530" y="100" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#B3E5FC">Shor's at scale</text>
  <text x="530" y="112" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#B3E5FC">Full drug design</text>
  <!-- Phase 4 Quantum Internet -->
  <rect x="700" y="28" width="180" height="32" rx="5" fill="#1B5E20" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="790" y="42" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold">Phase 4: Q Internet</text>
  <text x="790" y="54" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#A5D6A7">2030 &#x2014; 2040+</text>
  <text x="760" y="88" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#A5D6A7">Global QKD</text>
  <text x="760" y="100" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#A5D6A7">Distributed QC</text>
  <text x="760" y="112" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#A5D6A7">Blind computing</text>
  <!-- You are here marker -->
  <text x="100" y="26" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#EF5350">&#x25BC; You are here</text>
</svg>
