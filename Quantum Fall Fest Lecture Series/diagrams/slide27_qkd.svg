<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <rect width="900" height="120" fill="#0A1628" rx="8"/>
  <text x="14" y="18" font-family="Calibri,sans-serif" font-size="13" fill="#90CAF9" font-weight="bold">BB84 QUANTUM KEY DISTRIBUTION PROTOCOL</text>
  <!-- Step 1 Alice sends -->
  <text x="14" y="36" font-family="Calibri,sans-serif" font-size="11" fill="#B0BEC5">Step 1: Alice sends photons in random polarization bases</text>
  <!-- Alice box -->
  <rect x="14" y="44" width="60" height="30" rx="5" fill="#1565C0" stroke="#42A5F5" stroke-width="1.5"/>
  <text x="44" y="63" text-anchor="middle" font-family="Calibri,sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold">Alice</text>
  <!-- Photons: | / — \ -->
  <line x1="80" y1="59" x2="104" y2="59" stroke="#90CAF9" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="106" y1="50" x2="106" y2="68" stroke="#FFD54F" stroke-width="2"/>
  <line x1="120" y1="59" x2="144" y2="59" stroke="#90CAF9" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="146" y1="52" x2="162" y2="68" stroke="#66BB6A" stroke-width="2"/>
  <line x1="175" y1="59" x2="199" y2="59" stroke="#90CAF9" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="200" y1="59" x2="220" y2="59" stroke="#42A5F5" stroke-width="2"/>
  <line x1="232" y1="59" x2="256" y2="59" stroke="#90CAF9" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="256" y1="52" x2="272" y2="68" stroke="#EF5350" stroke-width="2"/>
  <!-- Channel with eavesdrop risk -->
  <line x1="278" y1="59" x2="340" y2="59" stroke="#B0BEC5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="309" y="53" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#B0BEC5">quantum channel</text>
  <!-- Eve warning -->
  <rect x="290" y="62" width="38" height="20" rx="3" fill="#B71C1C" stroke="#EF5350" stroke-width="1.5"/>
  <text x="309" y="74" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#FFFFFF" font-weight="bold">Eve?</text>
  <text x="309" y="92" text-anchor="middle" font-family="Calibri,sans-serif" font-size="8" fill="#EF9A9A">disturbs state!</text>
  <!-- Bob box -->
  <rect x="346" y="44" width="50" height="30" rx="5" fill="#1B5E20" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="371" y="63" text-anchor="middle" font-family="Calibri,sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold">Bob</text>
  <!-- Step 2 -->
  <text x="420" y="36" font-family="Calibri,sans-serif" font-size="11" fill="#B0BEC5">Step 2: Basis reconciliation (public)</text>
  <rect x="420" y="44" width="220" height="60" rx="5" fill="#1E3A5F" stroke="#37474F" stroke-width="1.2"/>
  <text x="420" y="60" font-family="Calibri,sans-serif" font-size="10" fill="#FFD54F">Alice basis:  +  &#xD7;  +  +  &#xD7;  +  &#xD7;</text>
  <text x="420" y="74" font-family="Calibri,sans-serif" font-size="10" fill="#90CAF9">Bob basis:   +  +  &#xD7;  +  &#xD7;  &#xD7;  +</text>
  <text x="420" y="88" font-family="Calibri,sans-serif" font-size="10" fill="#A5D6A7">Match?:       &#x2714;  &#x2718;  &#x2718;  &#x2714;  &#x2714;  &#x2718;  &#x2718;</text>
  <text x="420" y="100" font-family="Calibri,sans-serif" font-size="9" fill="#B0BEC5">Keep bits where bases matched</text>
  <!-- Security proof box -->
  <rect x="656" y="26" width="230" height="80" rx="6" fill="#1A237E" stroke="#3F51B5" stroke-width="1.5"/>
  <text x="771" y="44" text-anchor="middle" font-family="Calibri,sans-serif" font-size="12" fill="#FFD54F" font-weight="bold">Security Guarantee</text>
  <text x="666" y="60" font-family="Calibri,sans-serif" font-size="11" fill="#E3F2FD">&#x25AA; Eve must measure &#x2192; disturbs state</text>
  <text x="666" y="74" font-family="Calibri,sans-serif" font-size="11" fill="#E3F2FD">&#x25AA; Error rate spike &#x2192; Eve detected</text>
  <text x="666" y="88" font-family="Calibri,sans-serif" font-size="11" fill="#A5D6A7">&#x25AA; Proven unconditionally secure</text>
  <text x="666" y="102" font-family="Calibri,sans-serif" font-size="9" fill="#90CAF9">NOT based on computational hardness</text>
</svg>
