<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130">
  <rect width="900" height="130" fill="#0A1628" rx="8"/>
  <text x="14" y="18" font-family="Calibri,sans-serif" font-size="13" fill="#90CAF9" font-weight="bold">GROVER'S ALGORITHM  &#x2014;  Amplitude Amplification Visual</text>
  <!-- Bar chart showing amplitude amplification -->
  <text x="14" y="34" font-family="Calibri,sans-serif" font-size="11" fill="#B0BEC5">Step 1: Equal superposition (uniform amplitudes)</text>
  <rect x="14" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <rect x="28" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <rect x="42" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <rect x="56" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <rect x="70" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <rect x="84" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <rect x="98" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <rect x="112" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <text x="65" y="85" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#B0BEC5">All equal: 1/&#x221A;N</text>
  <!-- Arrow -->
  <text x="136" y="62" font-family="Calibri,sans-serif" font-size="20" fill="#FFD54F">&#x2192;</text>
  <!-- After oracle phase kick -->
  <text x="158" y="34" font-family="Calibri,sans-serif" font-size="11" fill="#B0BEC5">Step 2: Oracle marks target (phase flip)</text>
  <rect x="158" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <rect x="172" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <rect x="186" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <rect x="200" y="45" width="10" height="-30" fill="#EF5350" rx="1" transform="scale(1,-1) translate(0,-110)"/>
  <rect x="200" y="42" width="10" height="31" fill="#EF5350" rx="1" opacity="0.3"/>
  <rect x="214" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <rect x="228" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <rect x="242" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <rect x="256" y="38" width="10" height="35" fill="#546E7A" rx="1"/>
  <text x="209" y="85" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#EF9A9A">target: -1/&#x221A;N</text>
  <!-- Arrow 2 -->
  <text x="282" y="62" font-family="Calibri,sans-serif" font-size="20" fill="#FFD54F">&#x2192;</text>
  <!-- After diffusion -->
  <text x="304" y="34" font-family="Calibri,sans-serif" font-size="11" fill="#B0BEC5">Step 3: Diffusion amplifies target</text>
  <rect x="304" y="52" width="10" height="20" fill="#546E7A" rx="1"/>
  <rect x="318" y="52" width="10" height="20" fill="#546E7A" rx="1"/>
  <rect x="332" y="52" width="10" height="20" fill="#546E7A" rx="1"/>
  <rect x="346" y="28" width="10" height="45" fill="#66BB6A" rx="1"/>
  <rect x="360" y="52" width="10" height="20" fill="#546E7A" rx="1"/>
  <rect x="374" y="52" width="10" height="20" fill="#546E7A" rx="1"/>
  <rect x="388" y="52" width="10" height="20" fill="#546E7A" rx="1"/>
  <rect x="402" y="52" width="10" height="20" fill="#546E7A" rx="1"/>
  <text x="351" y="85" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#A5D6A7">amplified!</text>
  <!-- Arrow 3 -->
  <text x="426" y="62" font-family="Calibri,sans-serif" font-size="20" fill="#FFD54F">&#x2192;</text>
  <!-- After sqrt(N) iterations -->
  <text x="450" y="34" font-family="Calibri,sans-serif" font-size="11" fill="#B0BEC5">After &#x221A;N iterations: measure correct item</text>
  <rect x="450" y="68" width="10" height="4" fill="#546E7A" rx="1"/>
  <rect x="464" y="66" width="10" height="6" fill="#546E7A" rx="1"/>
  <rect x="478" y="22" width="10" height="50" fill="#66BB6A" rx="1"/>
  <rect x="492" y="67" width="10" height="5" fill="#546E7A" rx="1"/>
  <rect x="506" y="65" width="10" height="7" fill="#546E7A" rx="1"/>
  <rect x="520" y="68" width="10" height="4" fill="#546E7A" rx="1"/>
  <rect x="534" y="67" width="10" height="5" fill="#546E7A" rx="1"/>
  <rect x="548" y="66" width="10" height="6" fill="#546E7A" rx="1"/>
  <text x="483" y="85" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#A5D6A7">~100% prob</text>
  <!-- Stats box -->
  <rect x="580" y="26" width="306" height="90" rx="6" fill="#1E3A5F" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="733" y="44" text-anchor="middle" font-family="Calibri,sans-serif" font-size="13" fill="#FFD54F" font-weight="bold">Grover Speedup (N=1,000,000)</text>
  <text x="590" y="62" font-family="Calibri,sans-serif" font-size="12" fill="#EF9A9A">Classical:  500,000 queries on average</text>
  <text x="590" y="78" font-family="Calibri,sans-serif" font-size="12" fill="#A5D6A7">Grover:         1,000 queries (&#x221A;N)</text>
  <text x="590" y="94" font-family="Calibri,sans-serif" font-size="11" fill="#B0BEC5">Quadratic speedup  O(N) &#x2192; O(&#x221A;N)</text>
  <text x="590" y="108" font-family="Calibri,sans-serif" font-size="10" fill="#90CAF9">Proven optimal: no quantum algo can do better</text>
</svg>
