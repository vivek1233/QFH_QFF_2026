<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130">
  <rect width="900" height="130" fill="#0A1628" rx="8"/>
  <text x="14" y="18" font-family="Calibri,sans-serif" font-size="13" fill="#90CAF9" font-weight="bold">SHOR'S ALGORITHM  &#x2014;  Factoring via Quantum Period Finding</text>
  <!-- Flow diagram -->
  <!-- Box 1 -->
  <rect x="14" y="28" width="120" height="50" rx="6" fill="#1E3A5F" stroke="#42A5F5" stroke-width="1.5"/>
  <text x="74" y="47" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold">Input: N</text>
  <text x="74" y="62" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#90CAF9">integer to factor</text>
  <text x="74" y="91" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#B0BEC5">e.g. N = RSA-2048</text>
  <!-- arrow -->
  <line x1="134" y1="53" x2="154" y2="53" stroke="#1E88E5" stroke-width="1.5" marker-end="url(#a1)"/>
  <defs><marker id="a1" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1E88E5"/></marker></defs>
  <!-- Box 2 classical -->
  <rect x="154" y="28" width="120" height="50" rx="6" fill="#1B5E20" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="214" y="44" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#A5D6A7" font-weight="bold">Classical pre-proc.</text>
  <text x="214" y="58" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">Pick random a</text>
  <text x="214" y="70" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#E3F2FD">gcd(a,N)=1</text>
  <line x1="274" y1="53" x2="294" y2="53" stroke="#1E88E5" stroke-width="1.5" marker-end="url(#a1)"/>
  <!-- Box 3 QUANTUM -->
  <rect x="294" y="22" width="140" height="62" rx="6" fill="#1A237E" stroke="#7986CB" stroke-width="2"/>
  <text x="364" y="38" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#FFD54F" font-weight="bold">&#x26A1; QUANTUM STEP &#x26A1;</text>
  <text x="364" y="52" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#FFFFFF">Find period r of</text>
  <text x="364" y="64" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#FFFFFF">f(x) = a&#x1D465; mod N</text>
  <text x="364" y="76" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#9FA8DA">via Quantum Fourier Transform</text>
  <line x1="434" y1="53" x2="454" y2="53" stroke="#1E88E5" stroke-width="1.5" marker-end="url(#a1)"/>
  <!-- Box 4 classical post -->
  <rect x="454" y="28" width="130" height="50" rx="6" fill="#1B5E20" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="519" y="44" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#A5D6A7" font-weight="bold">Classical post-proc.</text>
  <text x="519" y="58" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#E3F2FD">gcd(a^(r/2)&#xB1;1, N)</text>
  <text x="519" y="70" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#E3F2FD">= prime factors p, q</text>
  <line x1="584" y1="53" x2="604" y2="53" stroke="#1E88E5" stroke-width="1.5" marker-end="url(#a1)"/>
  <!-- Box 5 output -->
  <rect x="604" y="28" width="110" height="50" rx="6" fill="#B71C1C" stroke="#EF5350" stroke-width="1.5"/>
  <text x="659" y="44" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold">N = p &#xD7; q</text>
  <text x="659" y="58" text-anchor="middle" font-family="Calibri,sans-serif" font-size="9" fill="#FFCDD2">RSA broken!</text>
  <text x="659" y="70" text-anchor="middle" font-family="Calibri,sans-serif" font-size="8" fill="#EF9A9A">p, q extracted</text>
  <!-- Bottom comparison -->
  <text x="14" y="102" font-family="Calibri,sans-serif" font-size="11" fill="#EF9A9A">Classical best (GNFS): O(exp(N^(1/3))) — intractable for RSA-2048</text>
  <text x="14" y="116" font-family="Calibri,sans-serif" font-size="11" fill="#A5D6A7">Shor's quantum:  O((log N)&#xB2; log log N) — EXPONENTIAL speedup</text>
  <text x="590" y="102" font-family="Calibri,sans-serif" font-size="10" fill="#B0BEC5">Requires: ~4,000 logical qubits</text>
  <text x="590" y="116" font-family="Calibri,sans-serif" font-size="10" fill="#B0BEC5">Timeline: ~10-15 years away</text>
</svg>
